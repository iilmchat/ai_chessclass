# ChessClass — staging-контур (S-58; ADR-014). Справочник: Design.md §15.1.
# Запуск: cp .env.staging.example .env.staging && docker compose --env-file .env.staging -f docker-compose.staging.yml up -d --build
# Миграции выполняются сервисом migrate до старта API/worker; seed — вручную (run --rm seed).
# Образы версионированы через IMAGE_TAG (default 0.5.0); при релизе обновлять
# вместе с pyproject.toml/package.json.
# Отличия от prod: APP_ENV=staging; порты 5440/6387/8032/3202/8080/8443; db/redis
# опубликованы на loopback хоста; отдельные volumes/сеть — prod-данные не трогаем.
# Рунбук: docs/runbooks/staging.md.

name: chessclass-staging

x-backend-env: &backend-env
  APP_ENV: staging
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set in .env.staging}:${POSTGRES_PASSWORD:?set in .env.staging}@db:5432/${POSTGRES_DB:-chessclass}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?set in .env.staging}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL_L1: ${LLM_MODEL_L1:-minimax-m3.1}
  LLM_MODEL_L2: ${LLM_MODEL_L2:-deepseek-v4.1}
  LLM_MODEL_L3: ${LLM_MODEL_L3:-beam-1.0-501b}
  LLM_MODEL_L3_ALT: ${LLM_MODEL_L3_ALT:-claude-sonnet-5.5}
  LLM_MODEL_JUDGE: ${LLM_MODEL_JUDGE:-decider-flash-v1.2}
  LLM_EMBED_MODEL: ${LLM_EMBED_MODEL:-}
  WEB_BASE_URL: ${WEB_BASE_URL:-https://localhost:8443}
  REPORTS_DIR: /srv/reports

x-env-file: &env-file
  - path: ${ENV_FILE:-.env.staging}
    required: false

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: chessclass-staging-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env.staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.staging}
      POSTGRES_DB: ${POSTGRES_DB:-chessclass}
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - chessclass_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-chessclass}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [ccnet]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: chessclass-staging-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6387}:6379"
    volumes:
      - chessclass_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [ccnet]
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    image: chessclass/backend:${IMAGE_TAG:-0.5.0}
    container_name: chessclass-staging-migrate
    command: alembic upgrade head
    env_file: *env-file
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    networks: [ccnet]
    restart: "no"

  api:
    build:
      context: ./backend
    image: chessclass/backend:${IMAGE_TAG:-0.5.0}
    container_name: chessclass-staging-api
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8020",
       "--workers", "${API_WORKERS:-4}"]
    env_file: *env-file
    environment:
      <<: *backend-env
      APP_ROLE: api
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8032}:8020"
    volumes:
      - chessclass_reports:/srv/reports
      - chessclass_voice:/srv/voice_cache
      - chessclass_archive:/srv/archive
      - ./deploy/jwt:/srv/jwt:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "python", "-c",
         "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 10
    networks: [ccnet]
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    image: chessclass/backend:${IMAGE_TAG:-0.5.0}
    container_name: chessclass-staging-worker
    command: arq app.worker.WorkerSettings
    env_file: *env-file
    environment:
      <<: *backend-env
      APP_ROLE: worker
    volumes:
      - chessclass_reports:/srv/reports
      - chessclass_archive:/srv/archive
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    networks: [ccnet]
    restart: unless-stopped

  worker-match-random:
    build:
      context: ./backend
    image: chessclass/backend:${IMAGE_TAG:-0.5.0}
    container_name: chessclass-staging-worker-match-random
    command: arq app.worker.WorkerSettings
    env_file: *env-file
    environment:
      <<: *backend-env
      APP_ROLE: worker
      WORKER_QUEUE: arq:matches:random
      WORKER_MAX_JOBS: "2"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    networks: [ccnet]
    restart: unless-stopped

  worker-match-greedy:
    build:
      context: ./backend
    image: chessclass/backend:${IMAGE_TAG:-0.5.0}
    container_name: chessclass-staging-worker-match-greedy
    command: arq app.worker.WorkerSettings
    env_file: *env-file
    environment:
      <<: *backend-env
      APP_ROLE: worker
      WORKER_QUEUE: arq:matches:greedy
      WORKER_MAX_JOBS: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    networks: [ccnet]
    restart: unless-stopped

  worker-match-minimax:
    build:
      context: ./backend
    image: chessclass/backend:${IMAGE_TAG:-0.5.0}
    container_name: chessclass-staging-worker-match-minimax
    command: arq app.worker.WorkerSettings
    env_file: *env-file
    environment:
      <<: *backend-env
      APP_ROLE: worker
      WORKER_QUEUE: arq:matches:minimax
      WORKER_MAX_JOBS: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    networks: [ccnet]
    restart: unless-stopped

  worker-match-sf:
    build:
      context: ./backend
    image: chessclass/backend:${IMAGE_TAG:-0.5.0}
    container_name: chessclass-staging-worker-match-sf
    command: arq app.worker.WorkerSettings
    env_file: *env-file
    environment:
      <<: *backend-env
      APP_ROLE: worker
      WORKER_QUEUE: arq:matches:sf
      WORKER_MAX_JOBS: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    networks: [ccnet]
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # S-58: бренд стадии — staging (prod-сборка оставляет prod).
        APP_STAGE: staging
    # Отдельный тег: staging-бинарь отличается от prod только брендом стадии.
    image: chessclass/frontend:${IMAGE_TAG:-0.5.0}-staging
    container_name: chessclass-staging-web
    # S-61: CSP report-only до закрытия аудита (после — enforce, как в prod).
    environment:
      CSP_MODE: report-only
    ports:
      - "${WEB_PORT:-3202}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [ccnet]
    restart: unless-stopped

  edge:
    image: nginx:1.27-alpine
    container_name: chessclass-staging-edge
    volumes:
      - ./deploy/nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CERTS_DIR:-./deploy/certs}:/etc/nginx/certs:ro
      - chessclass_certbot:/var/www/certbot:ro
    ports:
      - "${EDGE_HTTP_PORT:-8080}:80"
      - "${EDGE_HTTPS_PORT:-8443}:443"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test:
        ["CMD-SHELL",
         "wget -q --no-check-certificate -O /dev/null https://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 10
    networks: [ccnet]
    restart: unless-stopped

  # Ручные операции: docker compose --env-file .env.staging -f docker-compose.staging.yml run --rm seed
  seed:
    build:
      context: ./backend
    image: chessclass/backend:${IMAGE_TAG:-0.5.0}
    profiles: ["tools"]
    container_name: chessclass-staging-seed
    command: python -m db.seeds
    env_file: *env-file
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [ccnet]
    restart: "no"

volumes:
  chessclass_pgdata:
    name: chessclass_staging_pgdata
  chessclass_redisdata:
    name: chessclass_staging_redisdata
  chessclass_reports:
    name: chessclass_staging_reports
  chessclass_voice:
    name: chessclass_staging_voice
  chessclass_archive:
    name: chessclass_staging_archive
  chessclass_certbot:
    name: chessclass_staging_certbot

networks:
  ccnet:
    name: chessclass-staging-net
