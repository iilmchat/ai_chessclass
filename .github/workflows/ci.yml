name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: chess
          POSTGRES_PASSWORD: chess_ci
          POSTGRES_DB: chessclass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chess"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://chess:chess_ci@localhost:5432/chessclass
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret-please-change-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Typecheck (mypy)
        run: mypy .
      - name: Migrations
        run: alembic upgrade head
      - name: Seeds (smoke)
        run: python -m db.seeds
      - name: Tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Tests (Vitest)
        run: npm test
      - name: Build (tsc + vite)
        run: npm run build
