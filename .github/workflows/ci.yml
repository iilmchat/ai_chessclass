name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: chess
          POSTGRES_PASSWORD: chess_ci
          POSTGRES_DB: chessclass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chess"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://chess:chess_ci@localhost:5432/chessclass
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret-please-change-0123456789abcdef
      REPORTS_DIR: /tmp/chessclass-reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -e ".[dev]"
      - name: Install Stockfish + fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish fonts-dejavu-core
          stockfish_bin="$(command -v stockfish || true)"
          if [ -z "$stockfish_bin" ]; then
            stockfish_bin=/usr/games/stockfish
          fi
          echo "STOCKFISH_PATH=$stockfish_bin" >> "$GITHUB_ENV"
      - name: Lint (ruff)
        run: ruff check .
      - name: Typecheck (mypy)
        run: mypy .
      - name: Migrations
        run: alembic upgrade head
      - name: Seeds (smoke)
        run: python -m db.seeds
      - name: Tests
        run: python -m pytest -q
      - name: pip-audit (supply chain, S-62 lock)
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock --timeout 90
      - name: Doc-lint (release truth)
        working-directory: ${{ github.workspace }}
        run: python scripts/doc_lint.py --tests-count auto

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Tests (Vitest)
        run: npm test
      - name: Build (tsc + vite)
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: chess
          POSTGRES_PASSWORD: chess_ci
          POSTGRES_DB: chessclass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chess"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://chess:chess_ci@localhost:5432/chessclass
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret-please-change-0123456789abcdef
      LLM_BASE_URL: ""
      REPORTS_DIR: /tmp/chessclass-reports
      E2E_API_ORIGIN: http://127.0.0.1:8021
      API_PROXY: http://127.0.0.1:8021
      E2E_DATABASE_URL: postgresql://chess:chess_ci@localhost:5432/chessclass
      E2E_BASE_URL: http://127.0.0.1:3201
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Seeds
        working-directory: backend
        run: python -m db.seeds
      - name: Install PDF fonts + Stockfish
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core stockfish
          stockfish_bin="$(command -v stockfish || true)"
          if [ -z "$stockfish_bin" ]; then
            stockfish_bin=/usr/games/stockfish
          fi
          echo "STOCKFISH_PATH=$stockfish_bin" >> "$GITHUB_ENV"
      - name: Start API + worker
        working-directory: backend
        run: |
          nohup env APP_ROLE=api uvicorn app.main:app --host 127.0.0.1 --port 8021 \
            > ../e2e-api.log 2>&1 &
          nohup env APP_ROLE=worker arq app.worker.WorkerSettings \
            > ../e2e-worker.log 2>&1 &
          for kind in random greedy minimax sf; do
            max_jobs=1
            if [ "$kind" = "random" ]; then max_jobs=2; fi
            nohup env APP_ROLE=worker \
              WORKER_QUEUE="arq:matches:$kind" \
              WORKER_MAX_JOBS="$max_jobs" \
              arq app.worker.WorkerSettings \
              > "../e2e-worker-$kind.log" 2>&1 &
          done
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8021/readyz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat ../e2e-api.log
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright UI-e2e
        working-directory: frontend
        run: npm run test:e2e
      - name: "Backup → restore smoke (S-63: hash/users/alembic)"
        run: bash scripts/ci/backup_smoke.sh
      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results/
            frontend/playwright-report/
            e2e-api.log
            e2e-worker.log
            e2e-worker-*.log
          if-no-files-found: ignore

  # --- S-63: ворота (gate-матрица — docs/sprint-reports) ---

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image (hash-lock, S-62)
        run: docker build ./backend
      - name: Build frontend image (CSP enforce, S-61)
        run: docker build ./frontend
