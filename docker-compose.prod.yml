# ChessClass — prod-стек (S-30). Справочник: Design.md §15.1.
# S-92: образы тянутся из GHCR, локальной сборки в prod нет:
#   docker compose --env-file .env -f docker-compose.prod.yml pull
#   docker compose --env-file .env -f docker-compose.prod.yml up -d
# Миграции выполняются сервисом migrate до старта API/worker.
# Образы версионированы через IMAGE_TAG (default 0.8.0); при релизе обновлять
# вместе с pyproject.toml/package.json.
# TLS/edge-nginx и бэкапы по расписанию — S-38.

name: chessclass-prod

# S-92: json-file rotation для api/worker (10 MB × 5 файлов).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-env: &backend-env
  APP_ENV: prod
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:-chessclass}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?set in .env}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL_L1: ${LLM_MODEL_L1:-minimax-m3.1}
  LLM_MODEL_L2: ${LLM_MODEL_L2:-deepseek-v4.1}
  LLM_MODEL_L3: ${LLM_MODEL_L3:-beam-1.0-501b}
  LLM_MODEL_L3_ALT: ${LLM_MODEL_L3_ALT:-claude-sonnet-5.5}
  LLM_MODEL_JUDGE: ${LLM_MODEL_JUDGE:-decider-flash-v1.2}
  LLM_EMBED_MODEL: ${LLM_EMBED_MODEL:-}
  WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3200}
  REPORTS_DIR: /srv/reports
  # S-82: трейсы в prod-профиль observability (collector внутри сети).
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-chessclass-api}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  # S-92: Sentry опционален; пустой DSN выключает error-tracking.
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-prod}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}

x-env-file: &env-file
  - path: ${ENV_FILE:-.env}
    required: false

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: chessclass-prod-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-chessclass}
    volumes:
      - chessclass_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-chessclass}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [ccnet]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: chessclass-prod-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - chessclass_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [ccnet]
    restart: unless-stopped

  migrate:
    # S-92: образ из GHCR (publish workflow), локальная сборка только в CI.
    image: ghcr.io/iilmchat/chessclass-backend:${IMAGE_TAG:-0.8.0}
    container_name: chessclass-prod-migrate
    command: alembic upgrade head
    env_file: *env-file
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    networks: [ccnet]
    restart: "no"

  api:
    # S-92: образ из GHCR (publish workflow), локальная сборка только в CI.
    image: ghcr.io/iilmchat/chessclass-backend:${IMAGE_TAG:-0.8.0}
    container_name: chessclass-prod-api
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8020",
       "--workers", "${API_WORKERS:-4}"]
    env_file: *env-file
    environment:
      <<: *backend-env
      APP_ROLE: api
      # S-92: все uvicorn-воркеры пишут HTTP-метрики в общий каталог.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom_multiproc
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8020}:8020"
    volumes:
      - chessclass_reports:/srv/reports
      - chessclass_voice:/srv/voice_cache
      - chessclass_archive:/srv/archive
      - ./deploy/jwt:/srv/jwt:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "python", "-c",
         "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 10
    logging: *default-logging
    networks: [ccnet]
    restart: unless-stopped

  worker:
    # S-92: образ из GHCR (publish workflow), локальная сборка только в CI.
    image: ghcr.io/iilmchat/chessclass-backend:${IMAGE_TAG:-0.8.0}
    container_name: chessclass-prod-worker
    command: arq app.worker.WorkerSettings
    env_file: *env-file
    environment:
      <<: *backend-env
      APP_ROLE: worker
    volumes:
      - chessclass_reports:/srv/reports
      - chessclass_archive:/srv/archive
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    logging: *default-logging
    networks: [ccnet]
    restart: unless-stopped

  worker-match-random:
    # S-92: образ из GHCR (publish workflow), локальная сборка только в CI.
    image: ghcr.io/iilmchat/chessclass-backend:${IMAGE_TAG:-0.8.0}
    container_name: chessclass-prod-worker-match-random
    command: arq app.worker.WorkerSettings
    env_file: *env-file
    environment:
      <<: *backend-env
      APP_ROLE: worker
      WORKER_QUEUE: arq:matches:random
      WORKER_MAX_JOBS: "2"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    logging: *default-logging
    networks: [ccnet]
    restart: unless-stopped

  worker-match-greedy:
    # S-92: образ из GHCR (publish workflow), локальная сборка только в CI.
    image: ghcr.io/iilmchat/chessclass-backend:${IMAGE_TAG:-0.8.0}
    container_name: chessclass-prod-worker-match-greedy
    command: arq app.worker.WorkerSettings
    env_file: *env-file
    environment:
      <<: *backend-env
      APP_ROLE: worker
      WORKER_QUEUE: arq:matches:greedy
      WORKER_MAX_JOBS: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    logging: *default-logging
    networks: [ccnet]
    restart: unless-stopped

  worker-match-minimax:
    # S-92: образ из GHCR (publish workflow), локальная сборка только в CI.
    image: ghcr.io/iilmchat/chessclass-backend:${IMAGE_TAG:-0.8.0}
    container_name: chessclass-prod-worker-match-minimax
    command: arq app.worker.WorkerSettings
    env_file: *env-file
    environment:
      <<: *backend-env
      APP_ROLE: worker
      WORKER_QUEUE: arq:matches:minimax
      WORKER_MAX_JOBS: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    logging: *default-logging
    networks: [ccnet]
    restart: unless-stopped

  worker-match-sf:
    # S-92: образ из GHCR (publish workflow), локальная сборка только в CI.
    image: ghcr.io/iilmchat/chessclass-backend:${IMAGE_TAG:-0.8.0}
    container_name: chessclass-prod-worker-match-sf
    command: arq app.worker.WorkerSettings
    env_file: *env-file
    environment:
      <<: *backend-env
      APP_ROLE: worker
      WORKER_QUEUE: arq:matches:sf
      WORKER_MAX_JOBS: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    logging: *default-logging
    networks: [ccnet]
    restart: unless-stopped

  web:
    # S-92: образ из GHCR (publish workflow), локальная сборка только в CI.
    image: ghcr.io/iilmchat/chessclass-frontend:${IMAGE_TAG:-0.8.0}
    container_name: chessclass-prod-web
    ports:
      - "${WEB_PORT:-3200}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [ccnet]
    restart: unless-stopped

  edge:
    image: nginx:1.27-alpine
    container_name: chessclass-prod-edge
    volumes:
      - ./deploy/nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CERTS_DIR:-./deploy/certs}:/etc/nginx/certs:ro
      - chessclass_certbot:/var/www/certbot:ro
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test:
        ["CMD-SHELL",
         "wget -q --no-check-certificate -O /dev/null https://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 10
    networks: [ccnet]
    restart: unless-stopped

  # --- S-82: prod-observability (профиль observability, НЕ стартует по умолчанию).
  # Запуск: docker compose --env-file .env -f docker-compose.prod.yml \
  #           --profile observability up -d
  # TLS: сертификаты из ./deploy/internal-certs (scripts/gen-internal-certs.ps1).
  # Наружу публикуется только loopback (127.0.0.1) для отладки; Grafana — через
  # edge по /grafana/ (VPN/доверенная сеть). Tempo и collector портов не публикуют.
  tempo:
    image: grafana/tempo:2.6.1
    container_name: chessclass-prod-tempo
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./deploy/observability/prod/tempo.yml:/etc/tempo.yml:ro
      - ./deploy/internal-certs:/etc/obs-certs:ro
      - chessclass_prod_tempo:/var/tempo
    healthcheck:
      # HTTP API Tempo — plaintext внутри сети (mTLS только на OTLP-приёмниках).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3200/ready || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 10
    profiles: ["observability"]
    networks: [ccnet]
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    container_name: chessclass-prod-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/observability/prod/otel-collector.yml:/etc/otelcol/config.yaml:ro
      - ./deploy/internal-certs:/etc/obs-certs:ro
    # Healthcheck не задаём: образ distroless (нет sh/wget) — живость видна по
    # target otel-collector в Prometheus (:8889) и по логам контейнера.
    depends_on:
      tempo:
        condition: service_started
    profiles: ["observability"]
    networks: [ccnet]
    restart: unless-stopped

  # S-87: метрики файловых систем для алерта «диск observability заполнен».
  # node-exporter видит volumes профиля как отдельные mountpoint'ы (/var/tempo
  # и т.д.), поэтому правило сравнивает avail/size именно хранилища traces.
  # Портов не публикует: scrape идёт по внутренней сети.
  node-exporter:
    image: prom/node-exporter:v1.9.0
    container_name: chessclass-prod-node-exporter
    command:
      - "--path.rootfs=/"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run)($|/)"
    volumes:
      - chessclass_prod_tempo:/var/tempo:ro
      - chessclass_prod_prometheus:/prometheus:ro
      - chessclass_prod_alertmanager:/alertmanager:ro
      - chessclass_prod_grafana:/var/lib/grafana:ro
    profiles: ["observability"]
    networks: [ccnet]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: chessclass-prod-prometheus
    # Конфиг — шаблон: entrypoint рендерит METRICS_TOKEN и запускает Prometheus.
    entrypoint: ["/bin/sh", "/etc/prometheus/prometheus-entrypoint.sh"]
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      PROMETHEUS_RETENTION: ${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./deploy/observability/prod:/etc/prometheus:ro
      # Правила — отдельный mount: /etc/prometheus смонтирован read-only целиком,
      # вложенный mount в него невозможен.
      - ./deploy/observability/alerts.yml:/etc/prometheus-rules/alerts.yml:ro
      - chessclass_prod_prometheus:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9092}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 10
    profiles: ["observability"]
    networks: [ccnet]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: chessclass-prod-alertmanager
    # Образ имеет ENTRYPOINT=/bin/alertmanager — заменяем целиком, иначе
    # command уйдёт аргументами в alertmanager (`unexpected /bin/sh`).
    entrypoint: ["/bin/sh", "/etc/alertmanager/alertmanager-entrypoint.sh"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALERT_CHAT_ID: ${TELEGRAM_ALERT_CHAT_ID:-}
      # S-87: переопределяется только для selftest (детерминированный сбой
      # Telegram без egress); в prod — https://api.telegram.org.
      ALERT_TELEGRAM_API_URL: ${ALERT_TELEGRAM_API_URL:-https://api.telegram.org}
      # S-87: второй receiver (email). Включается, когда SMTP_HOST и
      # ALERT_EMAIL_TO непустые; иначе entrypoint удаляет email-блоки.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@chessclass.dev}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    volumes:
      - ./deploy/observability/prod:/etc/alertmanager:ro
      - chessclass_prod_alertmanager:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9093/-/ready || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 10
    # S-87: логи Alertmanager чувствительны даже после маскировки — ограничиваем
    # объём/время хранения на уровне docker (TTL в runbook §10.10).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    profiles: ["observability"]
    networks: [ccnet]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: chessclass-prod-grafana
    environment:
      # Дефолтный admin/admin отключён: пароль обязателен и задаётся в .env.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-chessadmin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://localhost/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - chessclass_prod_grafana:/var/lib/grafana
    ports:
      # Только loopback: доступ дежурного — через edge-TLS (/grafana/) или VPN.
      - "127.0.0.1:${GRAFANA_PORT:-3002}:3000"
    depends_on:
      - prometheus
      - tempo
    profiles: ["observability"]
    networks: [ccnet]
    restart: unless-stopped

  # Ручные операции: docker compose -f docker-compose.prod.yml run --rm seed
  seed:
    # S-92: образ из GHCR (publish workflow), локальная сборка только в CI.
    image: ghcr.io/iilmchat/chessclass-backend:${IMAGE_TAG:-0.8.0}
    profiles: ["tools"]
    container_name: chessclass-prod-seed
    command: python -m db.seeds
    env_file: *env-file
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [ccnet]
    restart: "no"

volumes:
  chessclass_pgdata:
    name: chessclass_prod_pgdata
  chessclass_redisdata:
    name: chessclass_prod_redisdata
  chessclass_reports:
    name: chessclass_prod_reports
  chessclass_voice:
    name: chessclass_prod_voice
  chessclass_archive:
    name: chessclass_prod_archive
  chessclass_certbot:
    name: chessclass_prod_certbot
  # S-82: persistent storage observability-профиля (Tempo 7 дней, Prometheus 15d)
  chessclass_prod_tempo:
    name: chessclass_prod_tempo
  chessclass_prod_prometheus:
    name: chessclass_prod_prometheus
  chessclass_prod_alertmanager:
    name: chessclass_prod_alertmanager
  chessclass_prod_grafana:
    name: chessclass_prod_grafana

networks:
  ccnet:
    name: chessclass-prod-net
