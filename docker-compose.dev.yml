# ChessClass — dev-стек. Контракт: Design.md §15.1; порты: ADR-013 (5438/6384).
# Запуск: docker compose -f docker-compose.dev.yml up -d
# KI-001: контейнеры ai_teacher_* не трогаем (5436/6383 заняты ими).

name: chessclass

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: chessclass-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chess}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chess_dev_2026}
      POSTGRES_DB: ${POSTGRES_DB:-chessclass}
    ports:
      - "${POSTGRES_PORT:-5438}:5432"
    volumes:
      - chessclass_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chess} -d ${POSTGRES_DB:-chessclass}"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [ccnet]

  redis:
    image: redis:7-alpine
    container_name: chessclass-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6384}:6379"
    volumes:
      - chessclass_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [ccnet]

  api:
    build:
      context: ./backend
    image: chessclass/backend:dev
    container_name: chessclass-api
    security_opt: ["seccomp=./deploy/seccomp-sandbox.json"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8020 --reload
    volumes:
      - ./backend:/srv/backend
      # S-60/S-61: doc-lint/release-truth тесты читают корень репо (/repo, ro)
      - .:/repo:ro
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chess}:${POSTGRES_PASSWORD:-chess_dev_2026}@db:5432/${POSTGRES_DB:-chessclass}
      REDIS_URL: redis://redis:6379/0
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # S-97: в Docker bwrap обязателен; тесты падают, а не skip.
      CHESSCLASS_REQUIRE_BWRAP: "1"
    ports:
      - "${API_PORT:-8020}:8020"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ccnet]

  worker:
    build:
      context: ./backend
    image: chessclass/backend:dev
    container_name: chessclass-worker
    security_opt: ["seccomp=./deploy/seccomp-sandbox.json"]
    command: arq app.worker.WorkerSettings
    volumes:
      - ./backend:/srv/backend
    env_file:
      - path: .env
        required: false
    environment: &backend_env
      APP_ENV: dev
      APP_ROLE: worker
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chess}:${POSTGRES_PASSWORD:-chess_dev_2026}@db:5432/${POSTGRES_DB:-chessclass}
      REDIS_URL: redis://redis:6379/0
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ccnet]

  worker-match-random:
    build:
      context: ./backend
    image: chessclass/backend:dev
    container_name: chessclass-worker-match-random
    security_opt: ["seccomp=./deploy/seccomp-sandbox.json"]
    command: arq app.worker.WorkerSettings
    volumes:
      - ./backend:/srv/backend
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend_env
      WORKER_QUEUE: arq:matches:random
      WORKER_MAX_JOBS: "2"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ccnet]

  worker-match-greedy:
    build:
      context: ./backend
    image: chessclass/backend:dev
    container_name: chessclass-worker-match-greedy
    security_opt: ["seccomp=./deploy/seccomp-sandbox.json"]
    command: arq app.worker.WorkerSettings
    volumes:
      - ./backend:/srv/backend
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend_env
      WORKER_QUEUE: arq:matches:greedy
      WORKER_MAX_JOBS: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ccnet]

  worker-match-minimax:
    build:
      context: ./backend
    image: chessclass/backend:dev
    container_name: chessclass-worker-match-minimax
    security_opt: ["seccomp=./deploy/seccomp-sandbox.json"]
    command: arq app.worker.WorkerSettings
    volumes:
      - ./backend:/srv/backend
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend_env
      WORKER_QUEUE: arq:matches:minimax
      WORKER_MAX_JOBS: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ccnet]

  worker-match-sf:
    build:
      context: ./backend
    image: chessclass/backend:dev
    container_name: chessclass-worker-match-sf
    security_opt: ["seccomp=./deploy/seccomp-sandbox.json"]
    command: arq app.worker.WorkerSettings
    volumes:
      - ./backend:/srv/backend
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend_env
      WORKER_QUEUE: arq:matches:sf
      WORKER_MAX_JOBS: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ccnet]

  migrate:
    build:
      context: ./backend
    image: chessclass/backend:dev
    profiles: ["tools"]
    container_name: chessclass-migrate
    command: alembic upgrade head
    volumes:
      - ./backend:/srv/backend
    env_file:
      - path: .env
        required: false
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
    networks: [ccnet]

  seed:
    build:
      context: ./backend
    image: chessclass/backend:dev
    profiles: ["tools"]
    container_name: chessclass-seed
    command: python -m db.seeds
    volumes:
      - ./backend:/srv/backend
    env_file:
      - path: .env
        required: false
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
    networks: [ccnet]

  web:
    image: node:20-alpine
    container_name: chessclass-web
    working_dir: /srv/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3200"
    volumes:
      - ./frontend:/srv/frontend
    environment:
      API_PROXY: http://api:8020
    ports:
      - "${WEB_PORT:-3200}:3200"
    depends_on:
      - api
    networks: [ccnet]

  # --- S-77 observability (profile: docker compose --profile observability up -d)
  tempo:
    image: grafana/tempo:2.6.1
    container_name: chessclass-tempo
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./deploy/observability/tempo.yml:/etc/tempo.yml:ro
    profiles: ["observability"]
    networks: [ccnet]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    container_name: chessclass-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/observability/otel-collector.yml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${OTEL_GRPC_PORT:-4319}:4317"
      - "127.0.0.1:${OTEL_HTTP_PORT:-4320}:4318"
    depends_on:
      - tempo
    profiles: ["observability"]
    networks: [ccnet]

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: chessclass-prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"
    depends_on:
      - api
    profiles: ["observability"]
    networks: [ccnet]

  grafana:
    image: grafana/grafana:11.4.0
    container_name: chessclass-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - tempo
    profiles: ["observability"]
    networks: [ccnet]

volumes:
  chessclass_pgdata:
    name: chessclass_pgdata
  chessclass_redisdata:
    name: chessclass_redisdata

networks:
  ccnet:
    name: chessclass-net
