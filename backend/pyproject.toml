[project]
name = "chessclass-backend"
version = "0.7.1"
description = "ChessClass API — монолит с доменной структурой (Design.md §3)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "arq>=0.26",
    "pyjwt>=2.10",
    "cryptography>=43",
    "argon2-cffi>=23.1",
    "RestrictedPython>=8.5",
    "chess>=1.10",
    "pgvector>=0.3",
    "fpdf2>=2.8",
    "httpx>=0.28",
    "orjson>=3.10",
    "pypdf>=5",
    # S-73 (ADR-017): сквозная трассировка API → arq → LLM.
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    # S-92: multiprocess HTTP metrics + optional Sentry error tracking.
    "prometheus-client>=0.21,<1",
    "sentry-sdk[fastapi]>=2.20,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "asgi-lifespan>=0.1",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "core*", "migrations*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() в сигнатурах

[tool.ruff.lint.per-file-ignores]
# контент сидов — длинные русские строки условий/подсказок
"db/seeds_tasks.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
