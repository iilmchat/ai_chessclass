# ChessClass web (S-30): SPA + прокси API. TLS/DMZ — edge-nginx в S-38.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # DNS Docker: upstream резолвится на запросе, nginx стартует даже если API ещё поднимается.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8020;

    gzip on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API v1 (включая SSE: буферизация выключена, длинный read timeout)
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 330s;
        proxy_buffering off;
    }

    location = /healthz {
        proxy_pass $api_upstream/healthz;
        proxy_set_header Host $host;
    }

    location = /readyz {
        proxy_pass $api_upstream/readyz;
        proxy_set_header Host $host;
    }

    # Хэшированные ассеты Vite — кэшируем надолго.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
