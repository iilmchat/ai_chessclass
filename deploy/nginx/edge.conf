# ChessClass edge nginx (S-38): TLS, HSTS, security headers, API/SSE proxy.
# HTTP :80 — redirect + ACME; HTTPS :443 — SPA/API.
# Сертификаты: /etc/nginx/certs/{fullchain.pem,privkey.pem} (volume).
# S-61: CSP излучается web-nginx (единая политика, заголовок проходит через
# edge; в location / нет своего add_header CSP — дублирования нет).
# S-90: edge rate-limit по реальному IP. limit_req_status=429, иначе nginx
# по умолчанию отдаёт 503. Auth — 10 r/m (burst 9 → 10 запросов, 11-й 429);
# общий API — 60 r/m (burst 30).
limit_req_zone $binary_remote_addr zone=auth_rl:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_rl:10m rate=60r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 10m;

    # Docker DNS: upstream резолвится лениво (edge может стартовать раньше web).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web_upstream http://web:80;
    set $api_upstream http://api:8020;

    # S-82: Grafana prod-observability только через edge-TLS (или VPN).
    # Сам контейнер grafana публикует порт только на 127.0.0.1; доступ снаружи
    # ограничьте на уровне сети/VPN (allow/deny по IP при необходимости).
    # Grafana настроена serve_from_sub_path=true и root_url .../grafana/.
    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /grafana;
        # Live-обновления дашбордов идут через WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # S-90: отдельный лимит для auth; location длиннее /api/, поэтому
    # nginx выбирает его. 10 запросов сразу, 11-й — 429.
    location /api/v1/auth/ {
        limit_req zone=auth_rl burst=9 nodelay;
        limit_req_status 429;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 330s;
        proxy_buffering off;
    }

    location /api/ {
        limit_req zone=api_rl burst=30 nodelay;
        limit_req_status 429;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 330s;
        proxy_buffering off;
    }

    location = /healthz {
        proxy_pass $api_upstream/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /readyz {
        proxy_pass $api_upstream/readyz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
