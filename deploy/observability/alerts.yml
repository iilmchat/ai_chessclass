# S-82: правила Prometheus для prod-контура observability.
# Алерты уходят в Alertmanager (Telegram) по route severity=critical/warning.
# Метрики: chessclass_http_requests_total / ..._duration_seconds_* /
# chessclass_failed_jobs — см. backend/domains/observability (S-46/S-77).
groups:
  - name: chessclass
    interval: 30s
    rules:
      # --- API: доступность и качество -------------------------------------
      - alert: ChessClassApiDown
        expr: up{job="chessclass-api"} == 0
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "ChessClass: API недоступен"
          description: >-
            Prometheus не может скрейпить /metrics 2 минуты. Проверьте
            `docker compose -f docker-compose.prod.yml ps` и логи api, затем
            readyz и диск. Runbook: docs/runbooks/operations.md §10.

      - alert: ChessClassHighErrorRate
        expr: |
          sum(rate(chessclass_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(chessclass_http_requests_total[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "ChessClass: >5% HTTP 5xx за 5 минут"
          description: >-
            Доля 5xx выше 5%. Проверьте /ops, последние trace_id в Tempo
            (Grafana), failed_jobs и LLM-провайдера.

      - alert: ChessClassP95LatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(chessclass_http_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "ChessClass: p95 latency > 2s"
          description: >-
            Смотрите route в Grafana (dashboards chessclass-http-traces) и
            trace в Tempo по trace_id; проверьте LLM-провайдера и БД.

      # --- Воркеры: DLQ ----------------------------------------------------
      - alert: ChessClassDLQGrowth
        expr: chessclass_failed_jobs > 10
        for: 10m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "ChessClass: в DLQ больше 10 упавших задач"
          description: >-
            Откройте /ops → «DLQ: упавшие задачи», разберите ошибки и
            используйте retry после исправления причины. Runbook §10.

      - alert: ChessClassDLQGrowthRate
        expr: delta(chessclass_failed_jobs[15m]) > 5
        for: 5m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "ChessClass: DLQ растёт (>5 задач за 15 минут)"
          description: >-
            Массовые падения фоновых задач. Проверьте worker-логи по
            trace_id, БД/Redis и LLM-провайдера; эскалируйте как SEV-2 при
            продолжении роста.

      # --- Email outbox / retention (S-88) ---------------------------------
      - alert: ChessClassEmailOutboxStuck
        expr: chessclass_email_outbox_oldest_pending_age_seconds > 3600
        for: 10m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "ChessClass: email_outbox застрял (>1 часа)"
          description: >-
            Самое старое недоставленное письмо ждёт больше часа. Проверьте
            cron `email_outbox_deliver` и логи worker, SMTP/egress и
            `chessclass_email_outbox_pending_total`; разбор —
            docs/runbooks/operations.md §10.13. Не удаляйте pending-строки:
            в теле письма одноразовая ссылка согласия.

      - alert: ChessClassRetentionArchiveStale
        expr: chessclass_retention_archive_age_seconds > 8 * 24 * 3600
        for: 1h
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "ChessClass: retention-архив не обновлялся > 8 дней"
          description: >-
            Последний gzip-архив retention старше 8 дней: cron `retention_run`
            не работает, `RETENTION_ARCHIVE_DIR` недоступен или нет строк под
            retention. Проверьте `/admin/observability/retention/status` и
            логи worker; действия — operations.md §10.13.

      # --- Offsite-бэкапы (S-93) -------------------------------------------
      - alert: ChessClassBackupFailed
        expr: |
          time() - chessclass_backup_last_success_timestamp_seconds > 25 * 3600
        for: 1h
        labels:
          severity: critical
          component: backup
        annotations:
          summary: "ChessClass: offsite-бэкап не обновлялся > 25 часов"
          description: >-
            `backup-offsite.ps1` не писал успешный статус > 25 ч. Проверьте cron,
            S3/credentials, `BACKUP_ENCRYPTION_KEY` и логи задачи. Runbook §17.

      - alert: ChessClassBackupRestoreFailed
        expr: chessclass_backup_restore_ok == 0
        for: 1h
        labels:
          severity: critical
          component: backup
        annotations:
          summary: "ChessClass: restore-test offsite-бэкапа упал"
          description: >-
            Последний `backup-restore-test.ps1` завершился ошибкой (users=0,
            alembic mismatch, decrypt/S3 failure). Скачивание и restore нужно
            повторить вручную; runbook §17.

      # --- Наблюдаемость: диск ----------------------------------------------
      # node-exporter (S-87) монтирует volume chessclass_prod_tempo в /var/tempo,
      # поэтому mountpoint в метрике — путь внутри его контейнера.
      - alert: ChessClassObservabilityDiskFull
        expr: |
          (
            node_filesystem_avail_bytes{mountpoint="/var/tempo"}
            /
            node_filesystem_size_bytes{mountpoint="/var/tempo"}
          ) < 0.10
        for: 10m
        labels:
          severity: critical
          component: observability
        annotations:
          summary: "ChessClass: диск observability заполнен (<10% свободно)"
          description: >-
            На volume chessclass_prod_tempo (/var/tempo) меньше 10% свободного
            места: Tempo перестанет принимать трейсы, Prometheus/Alertmanager
            могут потерять данные. Проверьте `df -h` и размер volumes,
            освободите место или уменьшите retention (operations.md §10.8).
